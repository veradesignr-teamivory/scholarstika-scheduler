# Free scheduler: GitHub runs this every 15 minutes and asks the app to publish anything that is due.
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   APP_URL      = your app's address, e.g. https://scheduler.scholarstika.org
#   CRON_SECRET  = the same CRON_SECRET you set on Vercel
# GitHub may start a run a few minutes late at busy times; posts still go out in order.
name: Publish due posts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the scheduler
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the APP_URL and CRON_SECRET repository secrets first."
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron")
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Scheduler returned HTTP $status"
            exit 1
          fi
